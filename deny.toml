# cargo-deny policy (schema v2). Run: make deny

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
# Exact SPDX ids needed by the dependency tree (after OR-resolution).
allow = ["MIT", "Apache-2.0", "BSD-3-Clause", "Unicode-3.0"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
