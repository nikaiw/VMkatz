[[bin]]
name = "extract_file"
path = "tools/extract_file.rs"
required-features = ["chrome"]

[package]
name = "vmkatz"
version = "1.4.5-beta.1"
edition = "2024"
license = "MIT"

[features]
default = ["vmware", "vbox", "qemu", "hyperv", "sam", "ntds.dit", "carve", "dump", "vmfs"]
vmware = ["dep:memmap2"]
vbox = []
qemu = ["dep:memmap2"]
hyperv = ["dep:memmap2"]
sam = ["dep:ntfs", "dep:md-5", "dep:sha2", "dep:pbkdf2", "dep:hmac", "dep:sha1"]
"ntds.dit" = ["sam"]
carve = []
dump = []
vmfs = ["sam"]
chrome = ["sam", "dep:aes-gcm", "dep:serde_json", "dep:serde", "dep:hmac", "dep:sha1"]

[profile.release]
opt-level = "z"
strip = true
lto = true
codegen-units = 1
panic = "abort"

[dependencies]
memmap2 = { version = "0.9", optional = true }
ntfs = { version = "0.4", optional = true }
md-5 = { version = "0.10", optional = true }
sha2 = { version = "0.10", optional = true }
aes = "0.8"
des = "0.8"
cbc = "0.1"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
anyhow = "1"
hex = "0.4"
log = "0.4"
memchr = "2"
aes-gcm = { version = "0.10", optional = true }
serde_json = { version = "1", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
hmac = { version = "0.12", optional = true }
sha1 = { version = "0.10", optional = true }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"], optional = true }

[lints.clippy]
# pedantic + nursery at deny; lints that are just noise for a low-level
# disk/memory forensic parser are allowed below (priority -1 lets these win).
pedantic = { level = "deny", priority = -1 }
nursery  = { level = "deny", priority = -1 }

# Deliberate for binary parsing: offset/size casts, format acronyms, long fns.
cast_possible_truncation = "allow"
cast_possible_wrap       = "allow"
cast_sign_loss           = "allow"
cast_precision_loss      = "allow"
doc_markdown             = "allow"
missing_errors_doc       = "allow"
missing_panics_doc       = "allow"
must_use_candidate       = "allow"
too_many_lines           = "allow"
similar_names            = "allow"
unreadable_literal       = "allow"
module_name_repetitions  = "allow"

# Opinion: the "fixed" form reads worse here.
option_if_let_else       = "allow"
verbose_bit_mask         = "allow"
collapsible_if           = "allow"  # 2024 let-chains vs our nested parse guards

# Low-value style/naming.
struct_field_names       = "allow"
many_single_char_names   = "allow"
too_many_arguments       = "allow"
struct_excessive_bools   = "allow"
naive_bytecount          = "allow"
chunks_exact_to_as_chunks = "allow"  # as_chunks() is newer API churn; chunks_exact reads clearly here
