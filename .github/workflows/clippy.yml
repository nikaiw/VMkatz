name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  # Weekly re-run so newly published advisories surface without a push.
  schedule:
    - cron: "0 6 * * 1"

# A new push to the same ref cancels an in-flight run, so a stuck run (e.g. a
# hung wine install) doesn't pile up or keep burning a runner.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # Bound the job: a hung step (e.g. apt stalling on a mirror/debconf prompt)
    # should fail fast and visibly, not run to the 6h default and look "blocked".
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install project toolchain and Windows target
        run: |
          rustc --version --verbose
          rustup target add x86_64-pc-windows-gnu

      - name: Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --all-features --all-targets -- -D warnings

      - name: Install mingw + wine (Windows cross-check)
        run: |
          # This install has intermittently hung on the Ubuntu runner (a stalled
          # mirror, or dpkg configure blocking). HTTP retries/timeout alone did not
          # catch it, so bound each attempt with a hard `timeout` and retry: a stall
          # now fails fast and self-heals on a fresh mirror instead of hanging the
          # job. Full recommends are kept — the `wine` launcher cargo invokes
          # (CARGO_TARGET_..._RUNNER=wine) ships with them.
          for attempt in 1 2 3; do
            sudo timeout 300 bash -euxc '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
                gcc-mingw-w64-x86-64 wine64
            ' && exit 0
            echo "::warning::wine install attempt ${attempt} stalled or failed; retrying"
            sleep 10
          done
          echo "::error::wine install failed after 3 attempts"
          exit 1

      - name: Clippy (Windows target)
        run: cargo clippy --locked --all-features --all-targets --target x86_64-pc-windows-gnu -- -D warnings

      - name: Tests
        run: cargo test --locked --all-features

      - name: Rustdoc
        run: make doc-check

      # The platform-divergent code (positioned reads, drop-behind, host-memory
      # query) is where cfg(windows) can compile and still be wrong. Clippy only
      # proves it builds; these two run it.
      - name: Tests (Windows target, under wine)
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_RUNNER: wine
          # Headless wine: don't pop the Mono/Gecko install dialog (hangs with no X).
          WINEDEBUG: -all
          WINEDLLOVERRIDES: mscoree=d;mshtml=d
        run: >
          cargo test --locked --all-features --target x86_64-pc-windows-gnu
          --test memory_limits --test positioned_read

  # Feature powerset clippy (-D warnings) in its own job: isolated features and pairs, slow on a cold runner.
  features:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install project toolchain
        run: rustc --version --verbose

      - name: Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install cargo-hack
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-hack

      - name: Feature matrix
        run: make check-features

  binary-size:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install project toolchain and musl target
        run: |
          rustc --version --verbose
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      - name: Check musl release binary size
        run: |
          cargo build --locked --release --target x86_64-unknown-linux-musl --bin vmkatz
          bash .github/check-binary-size.sh x86_64-unknown-linux-musl target/x86_64-unknown-linux-musl/release/vmkatz

  deps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install project toolchain
        run: rustc --version --verbose

      - name: Install dependency checks
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-deny,cargo-machete

      - name: cargo-deny (advisories, licenses, bans, sources)
        run: cargo deny --locked --all-features check

      - name: Unused dependencies
        run: cargo machete
