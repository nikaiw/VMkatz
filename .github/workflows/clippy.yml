name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# A new push to the same ref cancels an in-flight run, so a stuck run (e.g. a
# hung wine install) doesn't pile up or keep burning a runner.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # Bound the job: a hung step (e.g. apt stalling on a mirror/debconf prompt)
    # should fail fast and visibly, not run to the 6h default and look "blocked".
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        # Pinned: floating @stable pulls new clippy lints that break the deny-gate.
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt
          # Windows std: cfg(windows) breakage used to surface only at release time.
          # The -gnu target stands in for -msvc here (same cfg(windows) code paths)
          # because mingw can build the C deps on an ubuntu runner, msvc can't.
          targets: x86_64-pc-windows-gnu

      - name: Install mingw + wine (Windows cross-check)
        run: |
          # This install has intermittently hung on the Ubuntu runner (a stalled
          # mirror, or dpkg configure blocking). HTTP retries/timeout alone did not
          # catch it, so bound each attempt with a hard `timeout` and retry: a stall
          # now fails fast and self-heals on a fresh mirror instead of hanging the
          # job. Full recommends are kept — the `wine` launcher cargo invokes
          # (CARGO_TARGET_..._RUNNER=wine) ships with them.
          for attempt in 1 2 3; do
            sudo timeout 300 bash -euxc '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
                gcc-mingw-w64-x86-64 wine64
            ' && exit 0
            echo "::warning::wine install attempt ${attempt} stalled or failed; retrying"
            sleep 10
          done
          echo "::error::wine install failed after 3 attempts"
          exit 1

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-features -- -D warnings

      - name: Clippy (Windows target)
        run: cargo clippy --all-features --target x86_64-pc-windows-gnu -- -D warnings

      - name: Tests
        run: cargo test --all-features

      # The platform-divergent code (positioned reads, drop-behind, host-memory
      # query) is where cfg(windows) can compile and still be wrong. Clippy only
      # proves it builds; these two run it.
      - name: Tests (Windows target, under wine)
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_RUNNER: wine
          # Headless wine: don't pop the Mono/Gecko install dialog (hangs with no X).
          WINEDEBUG: -all
          WINEDLLOVERRIDES: mscoree=d;mshtml=d
        run: >
          cargo test --all-features --target x86_64-pc-windows-gnu
          --test memory_limits --test positioned_read
