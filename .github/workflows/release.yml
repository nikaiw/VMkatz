name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: linux-x86_64
            build: cargo
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            name: esxi-x86_64
            build: cargo

          # Linux aarch64 (native ARM runners)
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            name: linux-aarch64
            build: cargo
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            name: linux-aarch64-musl
            build: cargo

          # Linux armv7 (cross-compiled from x86_64)
          - target: armv7-unknown-linux-gnueabihf
            os: ubuntu-latest
            name: linux-armv7
            build: cross
          - target: armv7-unknown-linux-musleabihf
            os: ubuntu-latest
            name: linux-armv7-musl
            build: cross

          # Linux arm (armv5/v6, cross-compiled from x86_64)
          - target: arm-unknown-linux-gnueabihf
            os: ubuntu-latest
            name: linux-arm
            build: cross
          - target: arm-unknown-linux-musleabihf
            os: ubuntu-latest
            name: linux-arm-musl
            build: cross

          # macOS
          - target: aarch64-apple-darwin
            os: macos-latest
            name: macos-aarch64
            build: cargo
          - target: x86_64-apple-darwin
            os: macos-26-intel
            name: macos-x86_64
            build: cargo

          # Windows
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: windows-x86_64
            build: cargo
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
            name: windows-aarch64
            build: cargo

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install project toolchain and target
        run: |
          rustc --version --verbose
          rustup target add ${{ matrix.target }}

      - name: Install musl tools (x86_64)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install musl tools (aarch64)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross
        if: matrix.build == 'cross'
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cross

      - name: Build
        run: ${{ matrix.build }} build --locked --release --bin vmkatz --target ${{ matrix.target }}

      - name: Archive (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/vmkatz dist/vmkatz
          # Bundle the Python loader only in the ESXi musl build
          if [ "${{ matrix.name }}" = "esxi-x86_64" ]; then
            cp tools/vmkatz_loader.py dist/vmkatz_loader.py
          fi
          tar -C dist -czf "vmkatz-${GITHUB_REF_NAME}-${{ matrix.name }}.tar.gz" .

      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target\${{ matrix.target }}\release\vmkatz.exe dist\vmkatz.exe
          Compress-Archive -Path dist\vmkatz.exe -DestinationPath "vmkatz-${env:GITHUB_REF_NAME}-${{ matrix.name }}.zip"

      - name: Record executable size
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          EXE_SUFFIX: ${{ runner.os == 'Windows' && '.exe' || '' }}
        run: bash .github/check-binary-size.sh "$TARGET" "dist/vmkatz$EXE_SUFFIX"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vmkatz-${{ matrix.name }}
          path: vmkatz-${{ github.ref_name }}-*

  release:
    permissions:
      contents: write
    needs: build
    runs-on: ubuntu-latest
    # Only publish a release on tag pushes, not workflow_dispatch test runs
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Enforce release channel (stable only from main)
        run: |
          TAG="$GITHUB_REF_NAME"
          case "$TAG" in
            *-dev*|*-beta*|*-alpha*|*-rc*)
              echo "Prerelease tag $TAG — allowed from any branch (e.g. dev)."
              exit 0
              ;;
          esac
          git fetch --no-tags origin main
          if git merge-base --is-ancestor "${{ github.sha }}" origin/main; then
            echo "Stable tag $TAG is on main — OK."
          else
            echo "::error::Stable tag $TAG is not on main. Cut stable releases from main; tag dev builds as -dev/-alpha/-beta/-rc."
            exit 1
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true

      - name: Generate checksums
        run: sha256sum vmkatz-* > SHA256SUMS.txt

      - name: Generate changelog
        id: changelog
        run: |
          CURRENT_TAG="$GITHUB_REF_NAME"
          # If the current tag is a prerelease (dev/alpha/beta/rc), include previous
          # prereleases in the history. Otherwise, skip prereleases so the
          # changelog for a final release spans back to the last stable tag.
          if echo "$CURRENT_TAG" | grep -qE -- "-(dev|alpha|beta|rc)"; then
            PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${CURRENT_TAG}$" | head -1)
          else
            PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${CURRENT_TAG}$" | grep -v -E -- "-(dev|alpha|beta|rc)" | head -1)
          fi
          if [ -z "$PREV_TAG" ]; then
            PREV_TAG=$(git rev-list --max-parents=0 HEAD)
          fi
          echo "## Changes since ${PREV_TAG}" > CHANGELOG.md
          echo "" >> CHANGELOG.md
          git log --pretty=format:"- %s" "${PREV_TAG}..${CURRENT_TAG}" >> CHANGELOG.md
          echo "" >> CHANGELOG.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          prerelease: ${{ contains(github.ref_name, '-dev') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-rc') }}
          body_path: CHANGELOG.md
          files: |
            vmkatz-*
            SHA256SUMS.txt
